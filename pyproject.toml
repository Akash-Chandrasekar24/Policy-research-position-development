[project]
name = "policy-intelligence-orchestrator"
version = "0.1.0"
description = "Policy Intelligence Orchestrator for an MP's office, built on Claude Managed Agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.111.0",
    "dotenv>=0.9.9",
    "fastapi>=0.139.2",
    "fastembed>=0.8.0",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "sse-starlette>=3.4.5",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
policy-setup = "policy_orchestrator.cli.setup:main"
policy-session = "policy_orchestrator.cli.session:main"
policy-web = "policy_orchestrator.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises the local embedding model (first run downloads ~130MB)",
]
